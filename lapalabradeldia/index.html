<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle - Digitalización</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121213;
            color: white;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        .subtitulo { margin-bottom: 10px; color: #818384; }
        
        /* Estilo para la nueva pista */
        .pista { 
            font-style: italic; 
            color: #d7dadc; 
            margin-bottom: 25px; 
            font-size: 16px; 
            text-align: center; 
            max-width: 90%;
            background-color: #272729;
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 4px solid #b59f3b;
        }
        
        #tablero {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 20px;
        }
        .fila { display: flex; justify-content: center; gap: 5px; }
        .casilla {
            width: 50px; height: 50px; border: 2px solid #3a3a3c;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; font-weight: bold; text-transform: uppercase;
        }
        .correcta { background-color: #538d4e; border-color: #538d4e; }
        .presente { background-color: #b59f3b; border-color: #b59f3b; }
        .ausente { background-color: #3a3a3c; border-color: #3a3a3c; }
        #mensaje { font-size: 18px; font-weight: bold; height: 24px; color: #ff4a4a; margin-bottom: 10px; text-align: center; }
        
        /* ==========================================
           ESTILOS PARA EL TECLADO VIRTUAL
           ========================================== */
        #teclado {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        .fila-teclado {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .tecla {
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 15px 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            user-select: none;
            flex: 1;
            max-width: 45px;
        }
        .tecla:hover { background-color: #565758; }
        .tecla-larga { padding: 15px 10px; font-size: 14px; max-width: 80px; flex: 1.5; }
        
        /* Colores dinámicos del teclado */
        .tecla-verde { background-color: #538d4e !important; }
        .tecla-amarilla { background-color: #b59f3b !important; }
        .tecla-roja { background-color: #ff4a4a !important; }
        /* ========================================== */

        #btn-formulario {
            display: none; 
            background-color: #538d4e;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            animation: parpadeo 1.5s infinite;
            text-align: center;
        }
        #btn-formulario:hover { background-color: #43703e; }
        
        @keyframes parpadeo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instrucciones { margin-top: 30px; font-size: 14px; color: #818384; text-align: center; max-width: 400px; padding: 15px; border-top: 1px solid #3a3a3c; }
    </style>
</head>
<body>

    <h1>IT-Wordle</h1>
    <p class="subtitulo">Adivina la palabra de esta semana</p>
    
    <p id="texto-pista" class="pista"></p>

    <div id="tablero"></div>
    <div id="mensaje"></div>
    
    <div id="teclado"></div>
    
    <a id="btn-formulario" href="#" target="_blank">🏆 ¡Registrar mi victoria! 🏆</a>

    <div class="instrucciones">
        <p><strong>¿Cómo jugar?</strong> Usa el teclado en pantalla o el físico.</p>
        <p>🟩 Verde: Letra correcta en su sitio.<br>
           🟨 Amarillo: Letra correcta, pero en otro lugar.<br>
           ⬛ Gris/Rojo: La letra no está en la palabra.</p>
    </div>

    <script>
        // ==========================================
        // ZONA DEL PROFESOR: EDITA TUS DATOS AQUÍ
        // ==========================================
        
        const palabraSecreta = "ALGORITMO"; 
        
        // Escribe aquí la pista para ayudar a tus alumnos:
        const pistaSemana = "Secuencia de pasos lógicos para resolver un problema.";
        
        const enlaceGoogleForm = "https://forms.gle/TU_ENLACE_AQUI"; 
        
        // ==========================================

        const palabraObjetivo = palabraSecreta.toUpperCase();
        const longitudActual = palabraObjetivo.length;
        let intentoActual = 0;
        let casillaActual = 0;
        let juegoTerminado = false;

        const tecladoLayout = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ñ'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
        ];

        function inicializarJuego() {
            // Colocar la pista en su sitio
            document.getElementById('texto-pista').innerText = "💡 Pista: " + pistaSemana;
            
            // Preparar el enlace del formulario
            document.getElementById('btn-formulario').href = enlaceGoogleForm;

            // Crear el tablero
            const tablero = document.getElementById("tablero");
            tablero.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                let fila = document.createElement("div");
                fila.className = "fila";
                fila.id = `fila-${i}`;
                for (let j = 0; j < longitudActual; j++) {
                    let casilla = document.createElement("div");
                    casilla.className = "casilla";
                    casilla.id = `casilla-${i}-${j}`;
                    fila.appendChild(casilla);
                }
                tablero.appendChild(fila);
            }
        }

        function crearTeclado() {
            const contenedorTeclado = document.getElementById("teclado");
            contenedorTeclado.innerHTML = '';
            
            tecladoLayout.forEach(fila => {
                let filaDiv = document.createElement("div");
                filaDiv.className = "fila-teclado";
                fila.forEach(letra => {
                    let boton = document.createElement("button");
                    boton.className = "tecla";
                    boton.id = `tecla-${letra}`;
                    
                    if (letra === "ENTER" || letra === "DEL") {
                        boton.classList.add("tecla-larga");
                        boton.innerText = letra === "DEL" ? "BORRAR" : letra;
                    } else {
                        boton.innerText = letra;
                    }
                    
                    boton.onclick = () => manejarClickTeclado(letra);
                    filaDiv.appendChild(boton);
                });
                contenedorTeclado.appendChild(filaDiv);
            });
        }

        function manejarClickTeclado(tecla) {
            if (juegoTerminado) return;
            
            if (tecla === "ENTER") {
                comprobarPalabra();
            } else if (tecla === "DEL") {
                borrarLetra();
            } else {
                escribirLetra(tecla);
            }
            
            document.activeElement.blur();
        }

        document.addEventListener("keydown", (e) => {
            if (juegoTerminado) return;

            if (e.key === "Enter") {
                e.preventDefault(); 
                comprobarPalabra();
            } else if (e.key === "Backspace") {
                borrarLetra();
            } else if (/^[a-zA-ZñÑ]$/.test(e.key)) {
                escribirLetra(e.key.toUpperCase());
            }
        });

        function escribirLetra(letra) {
            if (casillaActual < longitudActual) {
                let casilla = document.getElementById(`casilla-${intentoActual}-${casillaActual}`);
                casilla.innerText = letra;
                casillaActual++;
            }
        }

        function borrarLetra() {
            if (casillaActual > 0) {
                casillaActual--;
                let casilla = document.getElementById(`casilla-${intentoActual}-${casillaActual}`);
                casilla.innerText = '';
            }
        }

        function comprobarPalabra() {
            if (casillaActual !== longitudActual) {
                mostrarMensaje("Faltan letras");
                return;
            }

            let adivinanza = "";
            for (let i = 0; i < longitudActual; i++) {
                adivinanza += document.getElementById(`casilla-${intentoActual}-${i}`).innerText;
            }

            let letrasObjetivo = palabraObjetivo.split("");
            let arrayAdivinanza = adivinanza.split("");
            let colores = new Array(longitudActual).fill("ausente");

            // Comprobar letras verdes
            for (let i = 0; i < longitudActual; i++) {
                if (arrayAdivinanza[i] === letrasObjetivo[i]) {
                    colores[i] = "correcta";
                    letrasObjetivo[i] = null; 
                }
            }

            // Comprobar letras amarillas
            for (let i = 0; i < longitudActual; i++) {
                if (colores[i] === "ausente" && letrasObjetivo.includes(arrayAdivinanza[i])) {
                    colores[i] = "presente";
                    letrasObjetivo[letrasObjetivo.indexOf(arrayAdivinanza[i])] = null;
                }
            }

            // Pintar casillas y teclado
            for (let i = 0; i < longitudActual; i++) {
                let letraJugada = arrayAdivinanza[i];
                let casilla = document.getElementById(`casilla-${intentoActual}-${i}`);
                let teclaVirtual = document.getElementById(`tecla-${letraJugada}`);
                
                // Tablero
                casilla.classList.add(colores[i]);

                // Teclado con lógica de prioridad (Verde > Amarillo > Rojo)
                if (teclaVirtual) {
                    if (colores[i] === "correcta") {
                        // Si es correcta, ponemos verde y quitamos rojo o amarillo si los tuviera
                        teclaVirtual.classList.remove("tecla-roja", "tecla-amarilla");
                        teclaVirtual.classList.add("tecla-verde");
                    } else if (colores[i] === "presente") {
                        // Si es amarilla, se pone amarilla solo si NO estaba verde ya
                        if (!teclaVirtual.classList.contains("tecla-verde")) {
                            teclaVirtual.classList.remove("tecla-roja");
                            teclaVirtual.classList.add("tecla-amarilla");
                        }
                    } else if (colores[i] === "ausente") {
                        // Si es roja, se pone roja solo si NO estaba verde ni amarilla
                        if (!teclaVirtual.classList.contains("tecla-verde") && !teclaVirtual.classList.contains("tecla-amarilla")) {
                            teclaVirtual.classList.add("tecla-roja");
                        }
                    }
                }
            }

            if (adivinanza === palabraObjetivo) {
                mostrarMensaje("¡Correcto! Corre a registrar tu victoria.", "#538d4e");
                document.getElementById('btn-formulario').style.display = 'inline-block';
                juegoTerminado = true;
            } else {
                intentoActual++;
                casillaActual = 0;
                if (intentoActual === 6) {
                    mostrarMensaje(`Fin del juego. La palabra era: ${palabraObjetivo}`);
                    juegoTerminado = true;
                }
            }
        }

        function mostrarMensaje(texto, color = "#ff4a4a") {
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.innerText = texto;
            mensajeDiv.style.color = color;
            if (!juegoTerminado) {
                setTimeout(() => { mensajeDiv.innerText = ''; }, 2000);
            }
        }

        inicializarJuego();
        crearTeclado();
    </script>
</body>
</html>
